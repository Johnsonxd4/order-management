services:
  postgres:
    image: postgres:17-alpine
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloakdb
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8080"

  catalog-api:
    build:
      context: .
      dockerfile: src/services/Catalog.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=catalogdb;Username=postgres;Password=postgres
      Cors__AllowedOrigins__0: http://localhost:3001
      Cors__AllowedOrigins__1: http://localhost:3002
      Cors__AllowedOrigins__2: http://localhost:3003
      Authentication__Issuer: http://localhost:8090/realms/ecommerce-platform
      Authentication__MetadataAddress: http://host.docker.internal:8090/realms/ecommerce-platform/.well-known/openid-configuration
      Authentication__RequireHttpsMetadata: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  inventory-api:
    build:
      context: .
      dockerfile: src/services/Inventory.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=inventorydb;Username=postgres;Password=postgres
      Cors__AllowedOrigins__0: http://localhost:3001
      Cors__AllowedOrigins__1: http://localhost:3002
      Cors__AllowedOrigins__2: http://localhost:3003
      Authentication__Issuer: http://localhost:8090/realms/ecommerce-platform
      Authentication__MetadataAddress: http://host.docker.internal:8090/realms/ecommerce-platform/.well-known/openid-configuration
      Authentication__RequireHttpsMetadata: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"

  orders-api:
    build:
      context: .
      dockerfile: src/services/Orders.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=ordersdb;Username=postgres;Password=postgres
      DownstreamServices__CatalogBaseUrl: http://catalog-api:8080
      DownstreamServices__InventoryBaseUrl: http://inventory-api:8080
      DownstreamServices__PaymentsBaseUrl: http://payments-api:8080
      Cors__AllowedOrigins__0: http://localhost:3001
      Cors__AllowedOrigins__1: http://localhost:3002
      Cors__AllowedOrigins__2: http://localhost:3003
      Authentication__Issuer: http://localhost:8090/realms/ecommerce-platform
      Authentication__MetadataAddress: http://host.docker.internal:8090/realms/ecommerce-platform/.well-known/openid-configuration
      Authentication__RequireHttpsMetadata: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      catalog-api:
        condition: service_started
      inventory-api:
        condition: service_started
      payments-api:
        condition: service_started
    ports:
      - "8083:8080"

  payments-api:
    build:
      context: .
      dockerfile: src/services/Payments.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=paymentsdb;Username=postgres;Password=postgres
      PaymentGateway__AutoApproveLimit: 5000
      PaymentGateway__BlockedTokens__0: tok_blocked_demo
      Cors__AllowedOrigins__0: http://localhost:3001
      Cors__AllowedOrigins__1: http://localhost:3002
      Cors__AllowedOrigins__2: http://localhost:3003
      Authentication__Issuer: http://localhost:8090/realms/ecommerce-platform
      Authentication__MetadataAddress: http://host.docker.internal:8090/realms/ecommerce-platform/.well-known/openid-configuration
      Authentication__RequireHttpsMetadata: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8080"

  customer-web:
    build:
      context: .
      dockerfile: src/frontends/Dockerfile
      args:
        PORTAL_KIND: customer
    depends_on:
      keycloak:
        condition: service_started
      catalog-api:
        condition: service_started
      orders-api:
        condition: service_started
    ports:
      - "3001:80"

  operations-web:
    build:
      context: .
      dockerfile: src/frontends/Dockerfile
      args:
        PORTAL_KIND: operations
    depends_on:
      keycloak:
        condition: service_started
      catalog-api:
        condition: service_started
      inventory-api:
        condition: service_started
      orders-api:
        condition: service_started
    ports:
      - "3002:80"

  admin-web:
    build:
      context: .
      dockerfile: src/frontends/Dockerfile
      args:
        PORTAL_KIND: admin
    depends_on:
      keycloak:
        condition: service_started
      orders-api:
        condition: service_started
      payments-api:
        condition: service_started
    ports:
      - "3003:80"

volumes:
  postgres-data:
